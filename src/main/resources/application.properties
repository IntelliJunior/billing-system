# ==== Server ====
server.port=8181

# ==== MySQL (default) ====
# Create the database first: CREATE DATABASE billing_system;
spring.datasource.url=jdbc:mysql://localhost:3306/billing_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==== To run without installing MySQL, comment out the MySQL block above ====
# ==== and uncomment this H2 in-memory config instead ====
# spring.datasource.url=jdbc:h2:mem:billingdb;DB_CLOSE_DELAY=-1
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ==== Jackson ====
spring.jackson.serialization.write-dates-as-timestamps=false
