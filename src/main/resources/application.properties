# ==== To run without installing MySQL, comment out the MySQL block above ====
# ==== and uncomment this H2 in-memory config instead ====
server.port=8181

# H2 saved to a file (data survives restarts)
spring.datasource.url=jdbc:h2:file:./data/billingdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==== Jackson ====
spring.jackson.serialization.write-dates-as-timestamps=false

app.admin.username=admin
app.admin.password=admin
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=lax
